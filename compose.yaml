services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitalsync}
      POSTGRES_USER: ${POSTGRES_USER:-vitalsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalsync-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitalsync} -d ${POSTGRES_DB:-vitalsync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vitalsync}:${POSTGRES_PASSWORD:-vitalsync-local-password}@database:5432/${POSTGRES_DB:-vitalsync}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-before-deployment}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-vitalsync-medquad-qwen3-4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
